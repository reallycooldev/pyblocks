<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PyBlocks Studio 2.3
— Quad-Course Academy</title>
<script src="skulpt.min.js"></script>
<script src="skulpt-stdlib.js"></script>
<style>
:root{--bg:#181825;--panel:#1e1e2e;--card:#252538;--border:#313244;--accent:#8aadf4;--accent2:#a6da95;--text:#cad3f5;--muted:#8087a2}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px 12px 44px;display:flex;flex-direction:column;align-items:center}
#toast{position:fixed;top:-90px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;gap:12px;transition:top .42s cubic-bezier(.22,1,.36,1);max-width:92vw}
#toast.show{top:16px}
.wrap{width:100%;max-width:940px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);padding:10px 14px;border-radius:14px}
.top a,.btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:10px;text-decoration:none;font-size:.82rem;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:#11111b;border:none}
.btn.ok{background:var(--accent2);color:#11111b;border:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ctabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:720px){.ctabs{grid-template-columns:repeat(2,1fr)}}
.ctab{background:var(--panel);border:2px solid var(--border);color:var(--text);padding:10px;border-radius:12px;text-align:left;cursor:pointer}
.ctab.done{border-color:var(--accent2)}
.ctab.active{border-color:var(--accent);background:var(--card)}
.ctab b{display:block;font-size:.84rem;color:var(--accent)}
.ctab.done b{color:var(--accent2)}
.ctab span{font-size:.72rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:265px 1fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;max-height:74vh;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.sec-lbl{font-size:.72rem;text-transform:uppercase;color:var(--accent2);font-weight:800;margin:6px 4px 2px;letter-spacing:.5px}
.st-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:9px;text-align:left;font-size:.8rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.st-btn.active{border-color:var(--accent);font-weight:700}
.st-btn.done{border-color:var(--accent2)}
.work{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.goal{background:var(--card);border-left:4px solid var(--accent);padding:10px 12px;border-radius:9px;font-size:.88rem;line-height:1.45}
.qbar{display:flex;flex-wrap:wrap;gap:5px}
.qbar button{background:var(--card);border:1px solid var(--border);color:var(--accent);padding:5px 9px;border-radius:7px;font-family:monospace;font-size:.82rem;font-weight:700;cursor:pointer}
textarea#code{width:100%;min-height:175px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px;font-family:monospace;font-size:.9rem;line-height:1.45;resize:vertical;tab-size:4}
.out-row{display:grid;grid-template-columns:1fr 264px;gap:10px}
@media(max-width:600px){.out-row{grid-template-columns:1fr}}
pre.term{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:140px;font-family:monospace;font-size:.83rem;white-space:pre-wrap;overflow-x:auto}
#tcanvas{width:260px;height:220px;margin:0 auto;background:#C0BFBC;border:2px solid var(--accent);border-radius:10px;position:relative;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:999}
.modal.open{display:flex}
.mcard{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:16px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:8px;font-family:monospace;font-size:.78rem;cursor:pointer}
.pills button.active{background:var(--accent);color:#11111b;font-weight:700}
</style>
</head>
<body>
<div id="toast"><div style="font-size:1.6rem" id="tIcon">🏆</div><div><div style="font-size:.72rem;text-transform:uppercase;color:var(--accent);font-weight:800" id="tSub">Stage Cleared!</div><div style="font-size:.96rem;font-weight:700" id="tName">Stage</div></div></div>
<div class="wrap">
  <div class="top">
    <a href="index.html">⬅ Menu</a>
    <b style="color:var(--accent)">🎓 Quad-Course Academy (2.3)</b>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openExplain()">📖 Explain Function</button>
      <a href="studio.html">Studio ⚡</a>
    </div>
  </div>
  <div class="ctabs" id="cTabs"></div>
  <div class="grid">
    <div class="side" id="stageList"></div>
    <div class="work">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <b id="stTitle" style="font-size:1.05rem;color:var(--accent)">Stage 1.1.1</b>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn" id="btnPrev" onclick="navStage(-1)">⬅️ Prev</button>
          <button class="btn" id="btnNext" onclick="navStage(1)">Next ➡️</button>
          <span id="stReward" style="font-size:.76rem;color:var(--accent2);font-weight:700"></span>
        </div>
      </div>
      <div class="goal" id="stGoal">Loading...</div>
      <div class="qbar" id="qbar"></div>
      <textarea id="code" spellcheck="false"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn pri" onclick="runStage()">▶ Run &amp; Check</button>
        <button class="btn" id="btnStageExp" onclick="openStageExplain()">📖 Explain</button>
        <button class="btn" onclick="useHint()">💡 Hint</button>
        <button class="btn" onclick="resetCode()">↺ Reset</button>
        <span id="hintTxt" style="font-size:.8rem;color:var(--accent2)"></span>
      </div>
      <div class="out-row">
        <pre class="term" id="out">Output will appear here...</pre>
        <div id="tcanvas"></div>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="expModal">
  <div class="mcard">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--accent)">📖 Explain Function &amp; Live Sandbox</b><button class="btn" onclick="closeExplain()">✕</button></div>
    <div class="pills" id="fnPills"></div>
    <div id="fnRules" style="font-size:.84rem;line-height:1.45;background:var(--card);padding:10px;border-radius:10px"></div>
    <textarea id="expCode" style="min-height:105px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px;font-family:monospace;font-size:.84rem"></textarea>
    <div style="display:flex;gap:8px"><button class="btn ok" onclick="runExplain()">▶ Test It</button></div>
    <pre class="term" id="expOut" style="min-height:70px">Tap 'Test It' to run!</pre>
  </div>
</div>
<script>window.onerror=(m,u,l)=>{document.getElementById("stGoal").textContent="❌ Line "+l+": "+m;};</script>
<script>
const EXPLAINS=[
  {fn:"print()",rules:"<b>Syntax:</b> <code>print(a, b)</code><br><b>Rule:</b> Wrap text in quotes <code>\" \"</code>. Separate multiple items with commas.",code:'name = "PyBlocks"\nprint("Welcome to", name, 2026)'},
  {fn:"variables",rules:"<b>Syntax:</b> <code>hp = 100</code><br><b>Rule:</b> Names can't have spaces or start with a digit. Use <code>+=</code> or <code>-=</code> to update.",code:'hp = 50\nhp += 25\nprint("HP is now:", hp)'},
  {fn:"// & %",rules:"<b>Syntax:</b> <code>450 // 100</code> and <code>17 % 5</code><br><b>Rule:</b> <code>//</code> (floor division) drops decimals for whole levels; <code>%</code> (modulo) gives the remainder.",code:'xp = 450\nprint("Level:", xp // 100)\nprint("Remainder:", 17 % 5)'},
  {fn:"if / else",rules:"<b>Syntax:</b> <code>if x &gt;= 10:</code><br><b>Rule:</b> End <code>if</code>, <code>elif</code>, and <code>else</code> with <code>:</code> and indent the next line 4 spaces.",code:'coins = 15\nif coins >= 10:\n    print("Bought Potion!")\nelse:\n    print("Need more coins")'},
  {fn:"for loop",rules:"<b>Syntax:</b> <code>for i in range(5):</code><br><b>Rule:</b> <code>range(5)</code> counts 0..4; <code>range(1, 6)</code> counts 1..5. Indent inside.",code:'for i in range(1, 4):\n    print("Combo hit", i)'},
  {fn:"list []",rules:"<b>Syntax:</b> <code>bag = [\"Key\", \"Gem\"]</code><br><b>Rule:</b> Use <code>.append(x)</code> to add, <code>sum(nums)</code> to total, and <code>len(bag)</code> to count.",code:'hits = Array.of(10, 20, 30)\nprint("Total:", sum(hits))'},
  {fn:"[::-1]",rules:"<b>Syntax:</b> <code>word[::-1]</code><br><b>Rule:</b> Slicing with a <code>-1</code> step walks backwards through a string or list to reverse it.",code:'secret = "SECRET"\nprint(secret[::-1])'},
  {fn:".join()",rules:"<b>Syntax:</b> <code>\" \".join(items)</code><br><b>Rule:</b> Glues a list or loop of strings together using the separator in front of <code>.join()</code>.",code:'parts = ["SOS", "HELP", "NOW"]\nprint(" - ".join(parts))'},
  {fn:"min / max",rules:"<b>Syntax:</b> <code>min(100, hp + 30)</code><br><b>Rule:</b> <code>min()</code> picks the smaller value (great for max-HP caps); <code>max()</code> picks the larger value (great for 0 floors).",code:'hp = 85\nprint("Capped HP:", min(100, hp + 30))\nprint("Blocked hit:", max(0, 10 - 25))'},
  {fn:"chr & ord",rules:"<b>Syntax:</b> <code>ord(\"A\")</code> &rarr; <code>65</code>, <code>chr(65)</code> &rarr; <code>\"A\"</code><br><b>Rule:</b> <code>ord()</code> turns a character into its ASCII number; <code>chr()</code> turns a number back into text.",code:'print("Code for A:", ord("A"))\nprint("Letter 72+73:", chr(72) + chr(73))'},
  {fn:"def ()",rules:"<b>Syntax:</b> <code>def boost(x):</code><br><b>Rule:</b> End <code>def</code> with <code>:</code>, indent the body, and use <code>return</code> to send back a result.",code:'def double_dmg(dmg):\n    return dmg * 2\nprint("Critical:", double_dmg(35))'},
  {fn:"dict {}",rules:"<b>Syntax:</b> <code>stats = {\"hp\": 100}</code><br><b>Rule:</b> Store <code>key: value</code> pairs inside <code>{}</code> and read them with <code>stats[\"hp\"]</code>.",code:'hero = {"name": "Nova", "lvl": 5}\nprint(hero["name"], "Lvl", hero["lvl"])'},
  {fn:"random",rules:"<b>Syntax:</b> <code>import random</code> &rarr; <code>random.randint(1, 6)</code><br><b>Rule:</b> Always import <code>random</code> at the top before rolling numbers.",code:'import random\nprint("D20 Roll:", random.randint(1, 20))'},
  {fn:"try/except",rules:"<b>Syntax:</b> <code>try: ... except: ...</code><br><b>Rule:</b> Catches runtime errors (like dividing by zero) safely without crashing.",code:'try:\n    print(10 / 0)\nexcept:\n    print("Safe fallback!")'},
  {fn:"turtle",rules:"<b>Syntax:</b> <code>import turtle</code> &rarr; <code>t = turtle.Turtle()</code><br><b>Rule:</b> Use <code>t.forward(60)</code>, <code>t.right(90)</code>, and <code>t.color(\"cyan\")</code> to draw.",code:'import turtle\nt = turtle.Turtle()\nt.color("cyan")\nfor i in range(4):\n    t.forward(60)\n    t.right(90)'}
];

function mkSec(cid,sid,sname,bpName,bpCode,arr){
  return arr.map((st,i)=>({
    id:`c${cid}_s${sid}_${i+1}`,cid,sid,sname,
    title:`${cid}.${sid}.${i+1} ${st.at(0)}`,
    goal:st.at(1),starter:st.at(2),hint:st.at(3),check:st.at(4),
    boss:i===arr.length-1,
    bp:i===arr.length-1?{id:`bp_${cid}_${sid}`,name:bpName,code:bpCode}:null
  }));
}
function hasTurtle(s,rx){
  return !!document.querySelector("#tcanvas canvas")&&/import\s+turtle|from\s+turtle/.test(s)&&rx.test(s);
}

let curCid=1,curSt=COURSES.at(0).sections.at(0),usedHint=false;
const SYMS=[["Tab","    "],["⇤ Tab","OUTDENT"],["( )","()"],["[ ]","[]"],["{ }","{}"],['" "','""'],[":",":"],["="," = "]];
function buildQbar(){
  const qb=document.getElementById("qbar");qb.innerHTML="";
  SYMS.forEach(([lbl,ins])=>{
    const b=document.createElement("button");b.textContent=lbl;
    b.onclick=()=>{
      const ta=document.getElementById("code"),s=ta.selectionStart,e=ta.selectionEnd;
      if(ins==="OUTDENT"){
        const ls=ta.value.lastIndexOf("\n",s-1)+1;
        const cut=Math.min(4,ta.value.slice(ls,s).search(/\S|$/));
        if(cut>0){ta.value=ta.value.slice(0,ls)+ta.value.slice(ls+cut);ta.focus();ta.setSelectionRange(s-cut,s-cut);}
      }else{
        ta.value=ta.value.slice(0,s)+ins+ta.value.slice(e);
        const pos=ins.length===2&&ins!=="  "?s+1:s+ins.length;
        ta.focus();ta.setSelectionRange(pos,pos);
      }
      if(typeof syncHi==="function")syncHi();
    };
    qb.appendChild(b);
  });
}

function renderTabs(){
  const box=document.getElementById("cTabs");box.innerHTML="";
  COURSES.forEach(c=>{
    const cleared=c.sections.filter(s=>state.done.includes(s.id)).length;
    const isFull=cleared>=c.sections.length;
    const b=document.createElement("button");
    b.className="ctab"+(c.id===curCid?" active":"")+(isFull?" done":"");
    b.innerHTML="<b>Course "+c.id+(isFull?" ✅":"")+"</b><span>"+c.name.split(": ").at(1)+" ("+cleared+"/"+c.sections.length+")</span>";
    b.onclick=()=>{curCid=c.id;curSt=c.sections.at(0);renderTabs();renderList();loadStage(curSt);};
    box.appendChild(b);
  });
}

  const box=document.getElementById("stageList");box.innerHTML="";
  const c=COURSES.find(x=>x.id===curCid);
  let lastSec="";
  c.sections.forEach(s=>{
    if(s.sname!==lastSec){

  curSt=s;usedHint=false;

  document.getElementById("btnPrev").disabled=idx<=0;
  document.getElementById("btnNext").disabled=idx>=c.sections.length-1;
  document.getElementById("stTitle").textContent=s.title;
  document.getElementById("stReward").textContent=s.bp?"🎁 Section Boss Unlocks: "+s.bp.name:(s.boss?"👑 Boss Stage":"+25 XP");

  document.getElementById("hintTxt").textContent="";
  document.getElementById("out").textContent="Ready to run...";

function useHint(){usedHint=true;document.getElementById("hintTxt").textContent="💡 "+curSt.hint;}
function resetCode(){document.getElementById("code").value=curSt.starter;}

function execPy(src,outEl,tTarget,onDone){
  let buf="";outEl.textContent="";
  if(tTarget)document.getElementById(tTarget).innerHTML="";
  Sk.configure({
    output:t=>{buf+=t;outEl.textContent=buf;},
    read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined)throw"File not found: "+x;return Sk.builtinFiles["files"][x];},
    inputfun:q=>prompt(q||"Enter input:")||"",
    inputfunTakesPrompt:true
  });
  if(tTarget)Sk.TurtleGraphics={target:tTarget,width:260,height:220};
  Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,src,true))
    .then(()=>onDone&&onDone(buf,null))
    .catch(err=>{outEl.textContent=buf+"\n❌ "+err.toString();onDone&&onDone(buf,err);});
}

function runStage(){
  const src=document.getElementById("code").value;
  execPy(src,document.getElementById("out"),"tcanvas",(buf,err)=>{
    if(!err&&curSt.check(buf,src)){
      if(!state.done.includes(curSt.id)){
        state.done.push(curSt.id);
        state.xp+=curSt.boss?60:25;
        if(curSt.bp&&!state.bps.some(x=>x.id===curSt.bp.id)){
          state.bps.push(curSt.bp);
          showToast("🎁","Section Blueprint Unlocked!",curSt.bp.name);
        }else{
          showToast("✅","Stage Cleared!",curSt.title);
        }
        if(state.done.length>=1)unlockTrophy("first_step","First Print");
        if(state.done.length>=60)unlockTrophy("halfway","Halfway Legend");
        if(state.bps.length>=6)unlockTrophy("bp_collector","Blueprint Collector");
        if(curSt.boss&&!usedHint)unlockTrophy("no_hint","Pure Skill");
        COURSES.forEach(c=>{
          if(c.sections.every(x=>state.done.includes(x.id)))unlockTrophy("c"+c.id+"_boss","Course "+c.id+" Champion");
        });
        if(state.done.length>=120)unlockTrophy("grandmaster","PyBlocks Legend");
        save();renderTabs();renderList();
      }else{
        showToast("✅","Passed Again!",curSt.title);
      }
    }
  });
}

let curExp=EXPLAINS.at(0);
function stageTopic(s){
  const txt=s.goal+" "+s.hint+" "+s.starter;
  if(s.cid===2)return"turtle";
  if(/\/\/|%/.test(txt))return"// & %";
  if(/min\(|max\(/.test(txt))return"min / max";
  if(/\[::-1\]/.test(txt))return"[::-1]";
  if(/\.join\(/.test(txt))return".join()";
  if(/chr\(|ord\(/.test(txt))return"chr & ord";
  if(/try:|except:/.test(txt))return"try/except";
  if(/random/.test(txt))return"random";
  if(/dict|\{/.test(txt))return"dict {}";
  if(/def /.test(txt))return"def ()";
  if(/list|append|sum\(|sort|bag|scores|hits|nums|loot/.test(txt))return"list []";
  if(/for |range\(/.test(txt))return"for loop";
  if(/if |elif |else:|==|>=|<=/.test(txt))return"if / else";
  if(s.cid===1&&s.sid===2)return"variables";
  return"print()";
}
function openStageExplain(){
  const topic=stageTopic(curSt);
  curExp=EXPLAINS.find(x=>x.fn===topic)||EXPLAINS.at(0);
  openExplain();
}
function openExplain(){
  document.getElementById("expModal").classList.add("open");
  const p=document.getElementById("fnPills");p.innerHTML="";
  EXPLAINS.forEach(ex=>{
    const b=document.createElement("button");b.textContent=ex.fn;
    b.className=ex.fn===curExp.fn?"active":"";
    b.onclick=()=>{curExp=ex;openExplain();};
    p.appendChild(b);
  });
  document.getElementById("fnRules").innerHTML=curExp.rules;
  document.getElementById("expCode").value=curExp.code;
  document.getElementById("expOut").textContent="Tap 'Test It' to run!";
}
function closeExplain(){document.getElementById("expModal").classList.remove("open");}
function runExplain(){
  unlockTrophy("sec_explain","Curious Mind");
  execPy(document.getElementById("expCode").value,document.getElementById("expOut"),null,null);
}

document.getElementById("code").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    const ta=e.target,s=ta.selectionStart,val=ta.value;
    const ls=val.lastIndexOf("\n",s-1)+1,line=val.slice(ls,s),tr=line.trim();
    let base=(line.match(/^\s*/)||Array.of("")).at(0);
    let prefix=val.slice(0,s);
    if(/^(else|elif\b.*|except\b.*|finally):$/.test(tr)&&base.length>=4){
      base=base.slice(4);
      prefix=val.slice(0,ls)+base+tr;
    }
    const nextIndent=base+(tr.endsWith(":")?"    ":"");
    ta.value=prefix+"\n"+nextIndent+val.slice(ta.selectionEnd);
    ta.selectionStart=ta.selectionEnd=prefix.length+1+nextIndent.length;
    if(typeof syncHi==="function")syncHi();
  }
});

applyTheme();buildQbar();renderTabs();loadStage(curSt);
</script>

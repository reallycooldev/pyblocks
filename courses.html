<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PyBlocks Studio 2.0.1 — Courses</title>
<script src="skulpt.min.js"></script>
<script src="skulpt-stdlib.js"></script>
<style>
:root{--bg:#181825;--panel:#1e1e2e;--card:#252538;--border:#313244;--accent:#8aadf4;--accent2:#a6da95;--text:#cad3f5;--muted:#8087a2}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px 12px 40px;display:flex;flex-direction:column;align-items:center}
#toast{position:fixed;top:-90px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;gap:12px;transition:top .42s cubic-bezier(.22,1,.36,1);max-width:92vw}
#toast.show{top:16px}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);padding:10px 14px;border-radius:14px}
.top a,.btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:10px;text-decoration:none;font-size:.82rem;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:#11111b;border:none}
.btn.ok{background:var(--accent2);color:#11111b;border:none}
.c-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.c-tabs{grid-template-columns:repeat(2,1fr)}}
.ctab{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:12px;text-align:left;cursor:pointer}
.ctab.active{border-color:var(--accent);background:var(--card)}
.ctab b{display:block;font-size:.85rem;color:var(--accent)}
.ctab span{font-size:.74rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:250px 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.list{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;max-height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sec-lbl{font-size:.73rem;font-weight:800;color:var(--accent);text-transform:uppercase;margin-top:6px;display:flex;justify-content:space-between}
.st-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:9px;text-align:left;font-size:.8rem;cursor:pointer;display:flex;justify-content:space-between}
.st-btn.active{border-color:var(--accent)}
.st-btn.done{border-color:var(--accent2)}
.work{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.goal{background:var(--card);border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;font-size:.86rem;line-height:1.45}
.qbar{display:flex;flex-wrap:wrap;gap:5px}
.qbar button{background:var(--card);border:1px solid var(--border);color:var(--accent);padding:5px 9px;border-radius:7px;font-family:monospace;font-size:.8rem;font-weight:700;cursor:pointer}
textarea{width:100%;min-height:150px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:monospace;font-size:.9rem;line-height:1.45;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.out-box{display:grid;grid-template-columns:1fr 264px;gap:10px}
@media(max-width:560px){.out-box{grid-template-columns:1fr}}
pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:220px;font-family:monospace;font-size:.83rem;white-space:pre-wrap;overflow-x:auto}
#tcanvas{width:260px;height:220px;margin:0 auto;background:var(--card);border:2px solid var(--accent);border-radius:10px;position:relative;overflow:hidden}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:9000}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--accent);border-radius:16px;width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto}
.fn-pills{display:flex;flex-wrap:wrap;gap:6px}
.fn-pills button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:8px;font-family:monospace;font-size:.8rem;cursor:pointer}
.fn-pills button.active{border-color:var(--accent);color:var(--accent)}
.rule-box{background:var(--card);padding:10px;border-radius:10px;font-size:.82rem;line-height:1.45}
</style>
</head>
<body>
<div id="toast"><div style="font-size:1.6rem" id="tIcon">🏆</div><div><div style="font-size:.72rem;text-transform:uppercase;color:var(--accent);font-weight:800" id="tSub">Achievement Unlocked!</div><div style="font-size:.96rem;font-weight:700" id="tName">Trophy</div></div></div>
<div class="wrap">
  <div class="top">
    <a href="index.html">⬅ Menu</a>
    <b style="color:var(--accent)">🎓 Quad-Course Academy (2.0.1)</b>
    <div class="row">
      <button class="btn" onclick="openExplain()">📖 Explain Function</button>
      <a href="studio.html">Studio ⚡</a>
    </div>
  </div>
  <div class="c-tabs" id="cTabs"></div>
  <div class="grid">
    <div class="list" id="stageList"></div>
    <div class="work">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h3 id="stTitle" style="color:var(--accent)">Stage</h3>
        <span id="stReward" style="font-size:.76rem;color:var(--accent2);font-weight:700"></span>
      </div>
      <div class="goal" id="stGoal"></div>
      <div class="qbar" id="qbar"></div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn pri" onclick="runStage()">▶ Run &amp; Check</button>
        <button class="btn" onclick="useHint()">💡 Hint</button>
        <button class="btn" onclick="resetCode()">↺ Reset</button>
        <span id="hintTxt" style="font-size:.8rem;color:var(--muted)"></span>
      </div>
      <div class="out-box">
        <pre id="out">Output appears here...</pre>
        <div id="tcanvas"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="expModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="color:var(--accent);font-size:1.05rem">📖 Explain Function — Live Sandbox</b>
      <button class="btn" onclick="closeExplain()">✕ Close</button>
    </div>
    <div class="fn-pills" id="fnPills"></div>
    <div class="rule-box" id="fnRules"></div>
    <label style="font-size:.78rem;color:var(--muted)">Edit the live code below and tap <b>Test It</b> to see what happens:</label>
    <textarea id="expCode" style="min-height:85px" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn ok" onclick="runExplain()">▶ Test It</button>
      <span style="font-size:.76rem;color:var(--muted)">Try removing quotes around words to see the error!</span>
    </div>
    <pre id="expOut" style="min-height:60px">Sandbox output...</pre>
  </div>
</div>
<script>
const EXPLAINS=[
  {fn:"print()",code:'print("Hello PyBlocks!")\nprint(42)',rules:'<b>print()</b> displays text or numbers on screen.<br>• <b>Words (strings)</b> MUST be inside quotes: "Hello" or \'Hello\'.<br>• <b>Numbers &amp; math</b> do NOT need quotes: print(10 + 5) prints 15.'},
  {fn:"variables",code:'hero = "Kai"\nhp = 100\nprint(hero, "has", hp, "HP")',rules:'<b>Variables</b> store data in a labeled box using =.<br>• Variable names cannot have spaces (use player_hp).<br>• Put quotes around text values, no quotes for numbers.'},
  {fn:"if / else",code:'score = 85\nif score >= 80:\n    print("Rank S!")\nelse:\n    print("Keep trying")',rules:'<b>if / else</b> makes decisions.<br>• Always end the if and else lines with a colon (:).<br>• Indent the code inside by <b>4 spaces</b> (tap Tab in the quick-bar).'},
  {fn:"for loop",code:'for i in range(1, 5):\n    print("Wave", i)',rules:'<b>for i in range(start, stop)</b> repeats code.<br>• range(1, 5) counts 1, 2, 3, 4 (stops right before the second number).<br>• Remember the colon (:) and 4-space indent!'},
  {fn:"dict {}",code:'loot = {"Sword": 25, "Potion": 10}\nprint("Sword dmg:", loot["Sword"])',rules:'<b>Dictionaries {}</b> pair keys with values (like an inventory or stats table).<br>• Look up a value using square brackets: loot["Sword"].'},
  {fn:"random",code:'import random\nroll = random.randint(1, 6)\nprint("Rolled:", roll)',rules:'<b>random.randint(a, b)</b> picks a random whole number from a to b (inclusive).<br>• Always put import random at the top first.'},
  {fn:"turtle",code:'import turtle\nt = turtle.Turtle()\nt.color("blue")\nfor i in range(4):\n    t.forward(70)\n    t.right(90)',rules:'<b>turtle</b> draws graphics on the canvas!<br>• t.forward(70) moves 70 pixels; t.right(90) turns 90 degrees.<br>• Combine with a for loop to draw polygons and spirals.'}
];

function mkSec(cid,sidx,sname,bpName,bpCode,items){
  return items.map((it,i)=>{
    const num=i+1,id="c"+cid+"_s"+sidx+"_"+num,boss=num===8;
    return{id,cid,sidx,sname,num,boss,title:cid+"."+sidx+"."+num+" "+it[0],goal:it[1],starter:it[2],hint:it[3],check:it[4],bp:boss?{id:"bp_"+cid+"_"+sidx,name:bpName,code:bpCode}:null};
  });
}

      ["Timer Bonus","Add secs_left*10 (12*10) to score=500; print 620",'score = 500\nsecs_left = 12\n','500 + 120 = 620',o=>o.trim()==="620"],

let state=JSON.parse(localStorage.getItem("pbs_v2")||'{"done":[],"xp":0,"trophies":[],"bps":[],"theme":"macchiato","custom":null}');
if(!state.bps)state.bps=[];
function save(){localStorage.setItem("pbs_v2",JSON.stringify(state));}

function applyTheme(){
  const THEMES={macchiato:{bg:"#181825",panel:"#1e1e2e",card:"#252538",accent:"#8aadf4",accent2:"#a6da95",text:"#cad3f5"},crimson:{bg:"#1a0d10",panel:"#261217",card:"#33181f",accent:"#f38ba8",accent2:"#fab387",text:"#fce8ec"},emerald:{bg:"#0c1a14",panel:"#12261d",card:"#183327",accent:"#40c080",accent2:"#a6e3a1",text:"#e2f5ec"},amber:{bg:"#1c150c",panel:"#291f12",card:"#362918",accent:"#f5a97f",accent2:"#eed49f",text:"#fbf0e4"},cyber:{bg:"#0d0c1d",panel:"#161430",card:"#1f1c42",accent:"#c6a0f6",accent2:"#7dc4e4",text:"#eae6ff"},ocean:{bg:"#0b1622",panel:"#112233",card:"#172e45",accent:"#38bdf8",accent2:"#34d399",text:"#e0f2fe"},mono:{bg:"#111111",panel:"#1b1b1b",card:"#262626",accent:"#ffffff",accent2:"#a3a3a3",text:"#f5f5f5"},sunset:{bg:"#1d101c",panel:"#2b172a",card:"#3b2039",accent:"#ff7b72",accent2:"#ffa657",text:"#ffeff7"}};
  const t=state.custom||THEMES[state.theme]||THEMES.macchiato;
  const r=document.documentElement.style;
  r.setProperty("--bg",t.bg);r.setProperty("--panel",t.panel);r.setProperty("--card",t.card);
  r.setProperty("--accent",t.accent);r.setProperty("--accent2",t.accent2);r.setProperty("--text",t.text);
}
function showToast(icon,sub,name){
  document.getElementById("tIcon").textContent=icon;
  document.getElementById("tSub").textContent=sub;
  document.getElementById("tName").textContent=name;
  const el=document.getElementById("toast");el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),3600);
}
function unlockTrophy(id,label){
  if(!state.trophies.includes(id)){
    state.trophies.push(id);save();
    showToast("🏆","Achievement Unlocked!",label);
  }
}

let curCid=1,curSt=COURSES.sections,usedHint=false;
const SYMS=[["Tab","    "],["( )","()"],["[ ]","[]"],["{ }","{}"],['" "','""'],[":",":"],["="," = "]];
function buildQbar(){
  const qb=document.getElementById("qbar");qb.innerHTML="";
  SYMS.forEach(([lbl,ins])=>{
    const b=document.createElement("button");b.textContent=lbl;
    b.onclick=()=>{
      const ta=document.getElementById("code"),s=ta.selectionStart,e=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+ins+ta.value.slice(e);
      const pos=ins.length===2&&ins!=="  "?s+1:s+ins.length;
      ta.focus();ta.setSelectionRange(pos,pos);
    };
    qb.appendChild(b);
  });
}

function renderTabs(){
  const box=document.getElementById("cTabs");box.innerHTML="";
  COURSES.forEach(c=>{
    const cleared=c.sections.filter(s=>state.done.includes(s.id)).length;
    const b=document.createElement("button");b.className="ctab"+(c.id===curCid?" active":"");
    b.innerHTML="<b>Course "+c.id+"</b><span>"+c.name.split(": ")+" ("+cleared+"/"+c.sections.length+")</span>";
    b.onclick=()=>{curCid=c.id;curSt=c.sections;renderTabs();renderList();loadStage(curSt);};
    box.appendChild(b);
  });
}
function renderList(){
  const box=document.getElementById("stageList");box.innerHTML="";
  const c=COURSES.find(x=>x.id===curCid);
  let lastSec="";
  c.sections.forEach(s=>{
    if(s.sname!==lastSec){
      lastSec=s.sname;
      const h=document.createElement("div");h.className="sec-lbl";h.textContent=s.sname;box.appendChild(h);
    }
    const b=document.createElement("button");
    const isDone=state.done.includes(s.id);
    b.className="st-btn"+(s.id===curSt.id?" active":"")+(isDone?" done":"");
    b.innerHTML="<span>"+(s.boss?"👑 ":"")+s.title+"</span><span>"+(isDone?"✅":s.boss?"🎁":"")+"</span>";
    b.onclick=()=>loadStage(s);box.appendChild(b);
  });
}
function loadStage(s){
  curSt=s;usedHint=false;
  document.getElementById("stTitle").textContent=s.title;
  document.getElementById("stReward").textContent=s.bp?"🎁 Section Boss Unlocks: "+s.bp.name:(s.boss?"👑 Boss Stage":"+25 XP");
  document.getElementById("stGoal").textContent=s.goal;
  document.getElementById("code").value=s.starter;
  document.getElementById("hintTxt").textContent="";
  document.getElementById("out").textContent="Ready to run...";
  document.getElementById("tcanvas").innerHTML="";
  renderList();
}
function useHint(){usedHint=true;document.getElementById("hintTxt").textContent="💡 "+curSt.hint;}
function resetCode(){document.getElementById("code").value=curSt.starter;}

function execPy(src,outEl,tTarget,onDone){
  let buf="";outEl.textContent="";
  if(tTarget)document.getElementById(tTarget).innerHTML="";
  Sk.configure({
    output:t=>{buf+=t;outEl.textContent=buf;},
    read:x=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined)throw"File not found: "+x;return Sk.builtinFiles["files"][x];},
    inputfun:q=>prompt(q||"Enter input:")||"",
    inputfunTakesPrompt:true
  });
  if(tTarget)Sk.TurtleGraphics={target:tTarget,width:260,height:220};
  Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,src,true))
    .then(()=>onDone&&onDone(buf,null))
    .catch(err=>{outEl.textContent=buf+"\n❌ "+err.toString();onDone&&onDone(buf,err);});
}

function runStage(){
  const src=document.getElementById("code").value;
  execPy(src,document.getElementById("out"),"tcanvas",(buf,err)=>{
    if(!err&&curSt.check(buf)){
      if(!state.done.includes(curSt.id)){
        state.done.push(curSt.id);
        state.xp+=curSt.boss?60:25;
        if(curSt.bp&&!state.bps.some(x=>x.id===curSt.bp.id)){
          state.bps.push(curSt.bp);
          showToast("🎁","Section Blueprint Unlocked!",curSt.bp.name);
        }else{
          showToast("✅","Stage Cleared!",curSt.title);
        }
        if(state.done.length>=1)unlockTrophy("first_step","First Print");
        if(curSt.boss&&!usedHint)unlockTrophy("no_hint","Pure Skill");
        COURSES.forEach(c=>{
          if(c.sections.every(x=>state.done.includes(x.id)))unlockTrophy("c"+c.id+"_boss","Course "+c.id+" Champion");
        });
        if(state.done.length>=120)unlockTrophy("grandmaster","PyBlocks Legend");
        save();renderTabs();renderList();
      }else{
        showToast("✅","Passed Again!",curSt.title);
      }
    }
  });
}

let curExp=EXPLAINS;
function openExplain(){
  document.getElementById("expModal").classList.add("open");
  const p=document.getElementById("fnPills");p.innerHTML="";
  EXPLAINS.forEach(ex=>{
    const b=document.createElement("button");b.textContent=ex.fn;
    b.className=ex.fn===curExp.fn?"active":"";
    b.onclick=()=>{curExp=ex;openExplain();};
    p.appendChild(b);
  });
  document.getElementById("fnRules").innerHTML=curExp.rules;
  document.getElementById("expCode").value=curExp.code;
  document.getElementById("expOut").textContent="Tap 'Test It' to run!";
}
function closeExplain(){document.getElementById("expModal").classList.remove("open");}
function runExplain(){
  unlockTrophy("sec_explain","Curious Mind");
  execPy(document.getElementById("expCode").value,document.getElementById("expOut"),null,null);
}

applyTheme();buildQbar();renderTabs();loadStage(curSt);
</script>
